name: Beta release

# Builds the Windows installer (NSIS setup) and publishes it to a
# floating `beta` prerelease tag. Runs the build on PRs too, but only
# publishes on pushes to main or manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create/update the beta release
    steps:
      - name: Checkout (with patcher submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            AssetRegistryPatcher/package-lock.json
            CookedDatatablePatcher/package-lock.json

      # windows-latest runners' Defender realtime scanning locks freshly
      # written files, making npm's cleanup randomly fail with EPERM rmdir
      # (typically on file-heavy packages like @types/node in the patchers).
      # The runner VM is discarded after the build, so disabling it here is safe.
      - name: Disable Defender realtime monitoring
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Each project installs separately (instead of via root postinstall) so
      # a failure lands in its own step with full, unwrapped logs. The
      # patchers' `prepare` scripts compile their dist/ output, which is why
      # they must install with scripts enabled. Re-run failed jobs from the
      # Actions UI if a step trips on transient Windows file locking.
      - name: Install dependencies (root)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install dependencies (AssetRegistryPatcher)
        run: npm ci --prefix ./AssetRegistryPatcher --no-audit --no-fund

      - name: Install dependencies (CookedDatatablePatcher)
        run: npm ci --prefix ./CookedDatatablePatcher --no-audit --no-fund

      # `prebuild` compiles both patchers before electron-builder runs.
      - name: Build installer (NSIS)
        run: npm run build -- --publish never

      - name: List artifacts
        run: Get-ChildItem dist/*.exe

      # Rename exes so each beta is identifiable: the version stays frozen
      # (see README), so the UTC date + commit go into the filename instead.
      # Renaming is safe: the NSIS installer does not depend on its own
      # filename (no latest.yml/blockmap is published).
      - name: Stamp beta filenames with date
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          Get-ChildItem dist/*.exe | ForEach-Object {
            $newName = "$($_.BaseName)-beta-$stamp-$sha$($_.Extension)"
            Rename-Item -LiteralPath $_.FullName -NewName $newName
            Write-Host "$($_.Name) -> $newName"
          }

      - name: Publish to `beta` tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          gh release delete beta --yes --cleanup-tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "No existing 'beta' release to replace." }
          gh release create beta --prerelease `
            --title "Beta build $stamp ($sha)" `
            --notes "Automated beta build from ``main`` @ $env:GITHUB_SHA ($stamp UTC). Filenames carry the build date and commit. Pre-release software, expect bugs. Windows SmartScreen will warn because the exes are unsigned — click More info / Run anyway." `
            dist/*.exe
